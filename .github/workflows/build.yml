name: DIM Rootless Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install patched iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          mkdir -p "$THEOS/sdks"

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid

      - name: Build DIM
        shell: bash
        run: |
          set -euo pipefail
          make clean package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DIM-Rootless
          path: packages/*.deb
          if-no-files-found: error
